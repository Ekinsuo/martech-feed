name: Build daily signals

on:
  schedule:
    - cron: "17 4 * * *"
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: write       # signals.json'ı repo'ya geri yazabilmek için gerekli

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build signals.json
        run: python build_signals.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals.json
          if git diff --staged --quiet; then
            echo "No changes — signals.json is already up to date."
          else
            git commit -m "chore: daily signals refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
